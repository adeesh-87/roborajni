[project]
name = "mb"
version = "0.4.1"
description = "Message board, job postings, path locks and a tmux launcher for agents working together"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mb = "mb.cli:main"
crew = "mb.crew:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mb"]
