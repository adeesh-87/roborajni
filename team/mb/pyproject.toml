[project]
name = "mb"
version = "0.3.0"
description = "Message board, job postings and path locks for agents working together"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mb = "mb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mb"]
